<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Go Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        #login { display: flex; justify-content: center; align-items: center; height: 100vh; }
        #login input { padding: 0.8rem 1.2rem; font-size: 1.1rem; border: 2px solid #444; border-radius: 8px; background: #16213e; color: #eee; outline: none; width: 250px; }
        #login input:focus { border-color: #e94560; }
        #login button { padding: 0.8rem 1.5rem; font-size: 1.1rem; border: none; border-radius: 8px; background: #e94560; color: #fff; cursor: pointer; margin-left: 0.5rem; }
        #chat { display: none; flex-direction: column; height: 100vh; }
        #header { background: #16213e; padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        #header h1 { font-size: 1.2rem; color: #e94560; }
        #online { color: #888; font-size: 0.9rem; }
        #messages { flex: 1; overflow-y: auto; padding: 1rem; }
        .msg { margin-bottom: 0.5rem; padding: 0.5rem 0.8rem; border-radius: 6px; max-width: 80%; }
        .msg.system { color: #888; font-style: italic; font-size: 0.9rem; text-align: center; max-width: 100%; }
        .msg.user { background: #16213e; }
        .msg .name { color: #e94560; font-weight: bold; margin-right: 0.5rem; }
        #input-area { display: flex; padding: 1rem; background: #16213e; border-top: 1px solid #333; }
        #input-area input { flex: 1; padding: 0.7rem; font-size: 1rem; border: 1px solid #333; border-radius: 8px; background: #1a1a2e; color: #eee; outline: none; }
        #input-area button { padding: 0.7rem 1.5rem; margin-left: 0.5rem; border: none; border-radius: 8px; background: #e94560; color: #fff; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div id="login">
        <input id="nameInput" type="text" placeholder="輸入你的暱稱" autofocus
               onkeydown="if(event.key==='Enter')join()">
        <button onclick="join()">加入聊天</button>
    </div>

    <div id="chat">
        <div id="header">
            <h1>Go Chat</h1>
            <span id="online"></span>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input id="msgInput" type="text" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter')send()">
            <button onclick="send()">送出</button>
        </div>
    </div>

    <script>
        let ws;

        function join() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) return;

            ws = new WebSocket(`ws://${location.host}/ws?name=${encodeURIComponent(name)}`);

            ws.onopen = () => {
                document.getElementById('login').style.display = 'none';
                document.getElementById('chat').style.display = 'flex';
                document.getElementById('msgInput').focus();
            };

            ws.onmessage = (event) => {
                addMessage(event.data);
            };

            ws.onclose = () => {
                addMessage('[系統] 連線已斷開');
            };
        }

        function send() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg || !ws) return;
            ws.send(msg);
            input.value = '';
        }

        function addMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg';

            if (text.startsWith('[系統]')) {
                div.classList.add('system');
                div.textContent = text;
            } else {
                div.classList.add('user');
                const colonIndex = text.indexOf(': ');
                if (colonIndex > -1) {
                    const name = document.createElement('span');
                    name.className = 'name';
                    name.textContent = text.substring(0, colonIndex);
                    div.appendChild(name);
                    div.appendChild(document.createTextNode(text.substring(colonIndex + 2)));
                } else {
                    div.textContent = text;
                }
            }

            const messages = document.getElementById('messages');
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
